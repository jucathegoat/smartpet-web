# Em producao, nao usar banco em memoria como fallback.
spring.datasource.url=${SMARTPET_DB_URL}
spring.datasource.username=${SMARTPET_DB_USER:${DB_USER}}
spring.datasource.password=${SMARTPET_DB_PASSWORD:${DB_PASS}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.sslMode=${DB_SSL:REQUIRED}
spring.datasource.hikari.data-source-properties.serverTimezone=UTC
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
