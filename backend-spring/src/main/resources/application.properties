server.port=8080

# Credenciais do painel administrativo
app.admin.username=${ADMIN_USER:adm}
app.admin.password=${ADMIN_PASSWORD:adm123}

# Banco de dados MySQL (Aiven)
spring.datasource.url=${SMARTPET_DB_URL:jdbc:mysql://localhost:3306/smartpet?serverTimezone=UTC}
spring.datasource.username=${SMARTPET_DB_USER:root}
spring.datasource.password=${SMARTPET_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# NAO deixar o Hibernate alterar o schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JSP
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# Jasper: compila os JSP mesmo empacotado como JAR
server.tomcat.basedir=./tomcat-work
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/static/
