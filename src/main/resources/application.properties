server.port=8086

# Admin Credentials
app.admin.username=${ADMIN_USER:adm}
app.admin.password=${ADMIN_PASSWORD}

# MySQL persistente. Configure SMARTPET_DB_URL, SMARTPET_DB_USER e
# SMARTPET_DB_PASSWORD no ambiente local antes de iniciar o backend.
spring.datasource.url=${SMARTPET_DB_URL:jdbc:mysql://localhost:3306/smartpet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SMARTPET_DB_USER:root}
spring.datasource.password=${SMARTPET_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# JSP
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp
app.demo.dados-exemplo=false
